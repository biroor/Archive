<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biroor Archive </title>
  <link rel="stylesheet" href="1.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📁 Biroor Archive</h1>
      <p>Yükle kullan knk</p>
    </header>

    <main>
      <!-- Yükleme Alanı -->
      <section class="upload-section">
        <h2>Dosya Yükle</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <div class="drag-drop-area" id="dragDropArea">
            <div class="drag-drop-content">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <h3>Dosyaları buraya sürükleyin</h3>
              <p>veya</p>
              <label for="fileInput" class="btn btn-primary">Dosya Seç</label>
            </div>
            <input type="file" id="fileInput" name="files[]" multiple hidden>
          </div>
          <div id="uploadProgress" style="display: none;">
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <p id="progressText">Yükleniyor...</p>
          </div>
        </form>
      </section>

      <!-- Dosya Listesi -->
      <section class="files-section">
        <h2>Dosyalar</h2>
        <div id="statsBar" class="stats-bar">
          <span id="fileCount">Toplam: 0 dosya</span>
        </div>
        
        <div id="filesList" class="files-list">
          <p class="no-files">Hiçbir dosya yok</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Biroor Archive. Tüm hakları saklıdır.</p>
    </footer>
  </div>

  <div id="toast" class="toast"></div>
  <script src="config.js"></script>
  <script src="1.js"></script>
</body>
</html>
